name: Deploy RiverHome to GitHub Pages

# Publishes the static site so it can be installed on a phone as a PWA.
# Pages source must be set to "GitHub Actions" (Settings -> Pages).

on:
  push:
    branches:
      - claude/river-app-migration-w3n1jh
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
