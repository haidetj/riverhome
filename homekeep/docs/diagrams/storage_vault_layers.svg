<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" style="background:#ffffff" font-family="sans-serif">
<title>Safe storage: household vault, anonymizer, de-personalized stats pool</title>
<desc>Each household has a private encrypted vault holding a media store and a home ledger, accessed by the owner and scoped agents. An anonymizer strips identity and aggregates before anything reaches a de-personalized stats pool used for benchmarks.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="520" fill="#ffffff"/>

<text x="90" y="130" text-anchor="middle" font-size="12" fill="#5F5E5A">Owner + agents</text>
<line x1="50" y1="150" x2="148" y2="150" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="160" y="40" width="480" height="200" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="400" y="66" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Private vault — one per household</text>
<text x="400" y="84" text-anchor="middle" font-size="12" fill="#0F6E56">Encrypted at rest, own keys · photos kept, audio discarded</text>

<rect x="180" y="110" width="200" height="110" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="280" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Media store</text>
<text x="280" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Photos and transcripts</text>

<rect x="420" y="110" width="200" height="110" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="520" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Home ledger</text>
<text x="520" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Records + embeddings</text>

<line x1="400" y1="240" x2="400" y2="270" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="160" y="280" width="480" height="70" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="400" y="304" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Anonymizer — one-way</text>
<text x="400" y="324" text-anchor="middle" font-size="12" fill="#5F5E5A">Strip identity, aggregate, minimum group sizes</text>

<line x1="400" y1="350" x2="400" y2="380" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="160" y="390" width="480" height="90" rx="20" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="400" y="420" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Stats pool — de-personalized</text>
<text x="400" y="440" text-anchor="middle" font-size="12" fill="#993C1D">Benchmarks, lifespan data, regional demand signals</text>
</svg>
