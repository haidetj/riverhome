<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 564" style="background:#ffffff" font-family="sans-serif">
<title>System pipeline with the Propose step drawn explicitly</title>
<desc>Photo, voice and text inputs feed an understanding agent, which proposes accept, edit or dismiss cards, which build the home ledger. The ledger drives a scheduler and a research agent, whose findings loop back as new proposals.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="564" fill="#ffffff"/>

<rect x="60" y="40" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Photo</text>
<text x="140" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Snap anything</text>

<rect x="260" y="40" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Voice</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Talk it through</text>

<rect x="460" y="40" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Text</text>
<text x="540" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Type a note</text>

<path d="M140 96 L140 118 L240 118 L240 130" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="340" y2="130" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M540 96 L540 118 L440 118 L440 130" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="190" y="140" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Understand</text>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Vision + LLM agent</text>

<line x1="340" y1="196" x2="340" y2="230" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="190" y="240" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Propose</text>
<text x="340" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Accept, edit, or dismiss cards</text>

<line x1="340" y1="296" x2="340" y2="330" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="190" y="340" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="358" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Home ledger</text>
<text x="340" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Semantic layer + records</text>

<path d="M340 396 L340 418 L185 418 L185 430" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M340 396 L340 418 L495 418 L495 430" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="60" y="440" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="185" y="458" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Scheduler</text>
<text x="185" y="478" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Reminders and check-ins</text>

<rect x="370" y="440" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="495" y="458" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Research agent</text>
<text x="495" y="478" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Enriches records headlessly</text>

<text x="495" y="520" text-anchor="middle" font-size="12" fill="#5F5E5A">↻ findings return to Propose as new cards</text>
</svg>
