# Static mission catalog. The war APIs expose planets and campaigns, never the
# per-planet mission pool — that is resolved client-side at operation select.
#
# STATUS: every entry is verified:false. This is a scaffold with the right SHAPE,
# populated from patch notes and general knowledge, NOT from a authoritative source.
# Cross-check against helldivers.wiki.gg before shipping. Names and difficulty gates
# are the likeliest fields to be wrong.
#
# duration_band drives mission count per operation (short = 12min, standard = 40min).
# difficulty_min matters: a Blitz at D4 and a Blitz at D10 are different kit problems.

