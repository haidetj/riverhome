# Biome -> default hazard set.
# Verified against helldiverstrainingmanual.com/api/v1/planets, build 24036910 (6.3.1).
# Holds for 268/274 planet indices. Contradictions live in planet_hazard_overrides.yaml.

superearth:
  display_name: Super Earth
  hazards: [rainstorms]

mesa:
  display_name: Mesa
  hazards: [durial_intense_heat, nocturnal_extreme_cold, sandstorms]
  note: Only biome with a day/night hazard pair. Kit must handle both heat and cold.

desert:
  display_name: Desert
  hazards: [durial_intense_heat, tremors]

canyon:
  display_name: Canyon
  hazards: [tremors]

highlands:
  display_name: Highlands
  hazards: [thick_fog, rainstorms]

moon:
  display_name: Moon
  hazards: [extreme_cold, meteor_storms]

rainforest:
  display_name: Rainforest
  hazards: [ion_storms]

jungle:
  display_name: Jungle
  hazards: [volcanic_activity, rainstorms]

toxic:
  display_name: Toxic
  hazards: [intense_heat, acid_storms]

winter:
  display_name: Winter
  hazards: [extreme_cold, blizzards]

icemoss:
  display_name: Ice Moss
  hazards: [extreme_cold]

icemoss-special:
  display_name: Ice Moss (Tien Kwan)
  hazards: [extreme_cold, meteor_storms]
  note: Single-planet biome. Tien Kwan (239) only.

crimsonmoor:
