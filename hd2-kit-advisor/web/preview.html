<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HD2 Kit Advisor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%96%3C/text%3E%3C/svg%3E">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Helldivers 2 planet + hazard kit advisor. Live war state, per-planet environmentals, and the kit tags each hazard favours or punishes.">

<style>
/* ---------- theme tokens ---------- */
:root{
  --bg:#0e1116; --surface:#161b22; --surface-2:#1c2430; --line:#2a3340;
  --ink:#e8edf3; --ink-2:#aeb9c7; --muted:#7d8899;
  --gold:#d7a53a; --gold-dim:#a7801f;
  --fac-terminids:#c6912b; --fac-automatons:#e05a5a; --fac-illuminate:#c084e8; --fac-super_earth:#6b93b8;
  --favored:#1fa98c; --avoid:#e2683c; --neutral:#8a94a6;
  --good:#2f9e6f; --warn:#d9a233; --crit:#e0574e; --info:#4c9be0;
  --radius:12px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="light"]{
  --bg:#f4f5f3; --surface:#ffffff; --surface-2:#f0f2f4; --line:#dfe3e8;
  --ink:#1a2029; --ink-2:#404a58; --muted:#6a7684;
  --gold:#a7801f; --gold-dim:#8a6b19;
  --fac-super_earth:#5b83a8;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f5f3; --surface:#ffffff; --surface-2:#f0f2f4; --line:#dfe3e8;
    --ink:#1a2029; --ink-2:#404a58; --muted:#6a7684;
    --gold:#a7801f; --gold-dim:#8a6b19; --fac-super_earth:#5b83a8;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:.2px}
a{color:var(--info)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:17px;letter-spacing:2px;text-transform:uppercase}
.brand .tag{color:var(--gold);font-weight:700;letter-spacing:3px;font-size:12px}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--ink-2)}
.badge .dot{width:7px;height:7px;border-radius:50%}
.dot.ok{background:var(--good)} .dot.stale{background:var(--warn)} .dot.err{background:var(--crit)}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:9px;padding:5px 9px;cursor:pointer;font-size:14px}
.iconbtn:hover{color:var(--ink);border-color:var(--muted)}
nav.tabs{display:flex;gap:2px;padding-bottom:10px}
nav.tabs button{background:none;border:none;color:var(--muted);font:inherit;font-weight:600;
  padding:8px 14px;cursor:pointer;border-radius:9px;letter-spacing:.3px}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--surface)}
nav.tabs button:hover{color:var(--ink)}

/* ---------- panels / cards ---------- */
main{padding:20px 0 60px}
.panel[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:14px}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);
  margin:0 0 10px;font-weight:700}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.tile .n{font-family:var(--mono);font-size:26px;font-weight:650;letter-spacing:-.5px}
.tile .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.tile .sub{font-size:12px;color:var(--ink-2);margin-top:6px}

/* MO banner */
.mo{background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 12%,var(--surface)),var(--surface));
  border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:var(--radius);padding:16px 18px;margin-bottom:18px}
.mo .k{color:var(--gold);font-weight:700;letter-spacing:2px;font-size:11px;text-transform:uppercase}
.mo h2{font-size:19px;margin:4px 0 6px}
.mo .chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}

/* campaign cards */
.campaigns{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.camp{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 15px;cursor:pointer;transition:border-color .12s, transform .12s;position:relative;overflow:hidden}
.camp:hover{border-color:var(--muted);transform:translateY(-1px)}
.camp .top{display:flex;align-items:flex-start;gap:8px}
.camp h3{font-size:16px}
.camp .sector{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt6{margin-top:6px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
  font-size:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.haz{font-weight:550}
.fac{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650}
.fac .sw{width:9px;height:9px;border-radius:2px}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  padding:2px 7px;border-radius:6px;border:1px solid transparent}
.pill.def{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 50%,transparent);
  background:color-mix(in srgb,var(--crit) 14%,transparent)}
.pill.lib{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent);
  background:color-mix(in srgb,var(--info) 12%,transparent)}
.pill.mo{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 55%,transparent);
  background:color-mix(in srgb,var(--gold) 14%,transparent)}

/* progress meter */
.meter{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter > i{display:block;height:100%;border-radius:6px}
.meter.lib > i{background:var(--info)} .meter.def > i{background:var(--crit)}
.meter-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:3px}

/* kit bars (diverging) */
.kit .krow{display:grid;grid-template-columns:150px 1fr 46px;align-items:center;gap:10px;margin:4px 0}
.kit .klabel{font-size:12.5px;color:var(--ink-2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ktrack{position:relative;height:14px;background:var(--surface-2);border-radius:5px}
.ktrack .zero{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.ktrack .bar{position:absolute;top:2px;bottom:2px;border-radius:4px}
.ktrack .bar.pos{left:50%;background:var(--favored)}
.ktrack .bar.neg{right:50%;background:var(--avoid)}
.kit .kval{font-family:var(--mono);font-size:12px;text-align:left}
.kval.pos{color:var(--favored)} .kval.neg{color:var(--avoid)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:2px}
.legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* planet browser */
.browser{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
input[type=search],select{background:var(--surface);border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:8px 11px;font:inherit;font-size:13.5px}
input[type=search]{flex:1;min-width:160px}
select{cursor:pointer}
.plist{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.pitem{padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.pitem:last-child{border-bottom:none}
.pitem:hover{background:var(--surface-2)}
.pitem[aria-selected="true"]{background:color-mix(in srgb,var(--gold) 12%,var(--surface))}
.pitem .nm{font-weight:600;font-size:14px}
.pitem .sc{font-size:11.5px;color:var(--muted)}
.pitem .hz{font-size:11px;color:var(--muted)}
.detail .hazdesc{font-size:12.5px;color:var(--ink-2);margin:2px 0 0}
.hazblock{border-top:1px solid var(--line);padding:10px 0}
.hazblock:first-of-type{border-top:none}
.sevdots{display:inline-flex;gap:3px;margin-left:6px}
.sevdots i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.35}
.sevdots i.on{opacity:1;background:var(--gold)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-left:3px solid var(--gold-dim);
  padding:8px 11px;border-radius:0 8px 8px 0;margin-top:10px}

/* advisor */
.advbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:16px}
.advout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.callout{border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:10px;
  padding:10px 12px;background:color-mix(in srgb,var(--gold) 9%,var(--surface));font-size:13px;margin-top:12px}
.callout b{color:var(--gold)}

/* tooltip */
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface-2);border:1px solid var(--muted);
  border-radius:8px;padding:7px 10px;font-size:12px;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0;transition:opacity .1s}
.tip .th{font-weight:700;margin-bottom:3px}
.tip .tr{display:flex;justify-content:space-between;gap:12px}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:18px 0 40px}
footer a{color:var(--ink-2)}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:820px){
  .browser{grid-template-columns:1fr}.advbar{grid-template-columns:1fr}.advout{grid-template-columns:1fr}
  .plist{max-height:44vh}
}
</style>
</head>

function meter(pct,kind){ const p=Math.max(0,Math.min(100,pct??0));
  return el("div",{},[
    el("div",{class:"meter-l"},[el("span",{},kind==="def"?"Enemy progress":"Liberation"),el("span",{class:"mono"},(pct==null?"—":p.toFixed(1)+"%"))]),
    el("div",{class:"meter "+kind},[el("i",{style:`width:${p}%`})]) ]); }

function kitBars(scores,max){ const box=el("div",{class:"kit"});
  const m=max||Math.max(0.1,...scores.map(s=>Math.abs(s.weight)));
  for(const s of scores){ const pos=s.weight>0, w=Math.abs(s.weight)/m*50;
    const bar=el("div",{class:"bar "+(pos?"pos":"neg"),style:`width:${w}%`});
    const track=el("div",{class:"ktrack"},[el("div",{class:"zero"}),bar]);
    const row=el("div",{class:"krow"},[
      el("div",{class:"klabel",title:tagLabel(s.tag)},tagLabel(s.tag)), track,
      el("div",{class:"kval "+(pos?"pos":"neg")},(pos?"+":"")+s.weight.toFixed(2)) ]);
    row.addEventListener("mousemove",e=>showTip(e,s));
    row.addEventListener("mouseleave",hideTip);
    box.append(row); }
  return box; }

function tip(){ return $("#tip"); }
function showTip(e,s){ const t=tip(); const H=state.data.rules.hazards;
  t.innerHTML=""; t.append(el("div",{class:"th"},tagLabel(s.tag)));
  s.parts.sort((a,b)=>b.w-a.w).forEach(p=>t.append(el("div",{class:"tr"},
    [el("span",{},(H[p.haz]||{}).display_name||p.haz), el("span",{class:"mono "+(p.w>0?"kval pos":"kval neg")},(p.w>0?"+":"")+p.w)])));
  t.style.opacity="1"; const pad=14;
  let x=e.clientX+pad, y=e.clientY+pad;
  const r=t.getBoundingClientRect();
  if(x+r.width>innerWidth-8)x=e.clientX-r.width-pad;
  if(y+r.height>innerHeight-8)y=e.clientY-r.height-pad;
  t.style.left=x+"px"; t.style.top=y+"px"; }
function hideTip(){ tip().style.opacity="0"; }

// ---------- freshness / header ----------
function relTime(iso){ if(!iso)return"unknown"; const d=(Date.now()-new Date(iso).getTime())/1000;
  if(isNaN(d))return"unknown"; if(d<90)return"just now"; if(d<5400)return Math.round(d/60)+" min ago";
  if(d<172800)return Math.round(d/3600)+" h ago"; return Math.round(d/86400)+" d ago"; }
function renderFreshness(){ const m=state.data.meta||{}, ts=(state.data.live||{}).generated_at||m.generated_at;
  const age=(Date.now()-new Date(ts||0).getTime())/3600000;
  const dot = !ts?"err": age>18?"stale":"ok";
  const b=$("#freshness"); b.innerHTML=""; b.append(el("span",{class:"dot "+dot}),el("span",{},"Sourced "+relTime(ts)));
  const drift=(m.canary||{}).drift_count||0; const db=$("#driftbadge");
  if(drift>0){ db.hidden=false; db.innerHTML=""; db.append(el("span",{class:"dot stale"}),el("span",{},`canary: ${drift} drift`)); db.title="Seed disagrees with live /planets — a patch likely shipped. Re-verify the seed."; }
}
function wireHeader(){
  $$("nav.tabs button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
  $("#themebtn").addEventListener("click",toggleTheme);
}
function setTab(t){ state.tab=t; $$("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  ["front","planets","advisor"].forEach(id=>$("#"+id).hidden=id!==t); }
function initTheme(){ const s=localStorage.getItem("hd2theme"); if(s)document.documentElement.setAttribute("data-theme",s); }
function toggleTheme(){ const cur=document.documentElement.getAttribute("data-theme");
  const isDark = cur? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next=isDark?"light":"dark"; document.documentElement.setAttribute("data-theme",next); localStorage.setItem("hd2theme",next); }

// ---------- render all ----------
function renderAll(){ renderFront(); renderPlanets(); renderAdvisor(); }

// ===== FRONT =====
function renderFront(){
  const root=$("#front"); root.innerHTML="";
  const live=state.data.live||{}, camps=live.campaigns||[], sum=live.summary||{};
  const orders=(state.data.mos||{}).orders||[];

  // MO banner
  if(orders.length){ const o=orders[0];
    const chips=el("div",{class:"chips"});
    (o.target_planets||[]).forEach(id=>{ const p=state.data.byId[id]; if(!p)return;
      chips.append(el("span",{class:"chip",onclick:()=>openPlanet(id)},`${p.name}`)); });
    root.append(el("div",{class:"mo"},[
      el("div",{class:"k"},"Major Order"),
      el("h2",{},o.title||"Active Major Order"),
      el("div",{class:"muted",style:"font-size:13.5px"},o.briefing||o.description||""),
      el("div",{class:"row between mt10"},[ chips, moTimer(o) ]) ]));
  }

  // stat tiles
  const fp=sum.faction_players||{};
  const facLine = Object.entries(fp).sort((a,b)=>b[1]-a[1])
    .map(([f,n])=>`${FACTION[f]?FACTION[f].icon:""}${(n/1000).toFixed(0)}k`).join("  ");
  root.append(tiles([
    ["Active fronts", sum.active_campaigns??camps.length, "campaigns live"],
    ["Defenses", sum.defenses??camps.filter(c=>c.is_defense).length, "on the clock"],
    ["MO targets", sum.mo_targets??camps.filter(c=>c.is_mo_target).length, "priority planets"],
    ["Divers deployed", sum.total_players!=null?fmt(sum.total_players):"—", facLine||"across all fronts"],
  ]));

  root.append(el("div",{class:"section-title"},"Active campaigns — ranked by urgency"));
  if(!camps.length){ root.append(el("div",{class:"card empty"},"No live campaign data. The sourcing job populates this every few hours.")); return; }
  const grid=el("div",{class:"campaigns"});
  camps.forEach(c=>grid.append(campCard(c)));
  root.append(grid);
}
function moTimer(o){ let txt="";
  if(o.expires_at){ txt=countdown(o.expires_at); }
  else if(o.expires_in_s!=null){ txt=dur(o.expires_in_s); }
  return el("span",{class:"badge"},[el("span",{class:"dot stale"}),el("span",{class:"mono"},txt||"active")]); }

function campCard(c){
  const card=el("div",{class:"camp",onclick:()=>openPlanet(c.id)});
  card.append(el("div",{class:"top between"},[
    el("div",{},[el("h3",{},c.name||("Planet "+c.id)), el("div",{class:"sector"},c.sector||"")]),
    el("div",{class:"row",style:"gap:5px;justify-content:flex-end"},[
      c.is_mo_target?el("span",{class:"pill mo"},"★ MO"):null,
      c.is_defense?el("span",{class:"pill def"},"Defense"):el("span",{class:"pill lib"},"Liberate") ]) ]));
  card.append(el("div",{class:"row mt8"},[ facChip(c.owner),
    el("span",{class:"muted",style:"font-size:12.5px"},`· ${fmt(c.players)} divers`) ]));
  card.append(el("div",{class:"mt10"},[ meter(c.liberation, c.is_defense?"def":"lib") ]));
  if(c.is_defense && c.expires_at) card.append(el("div",{class:"row mt6"},
    [el("span",{class:"pill def"},"⏱ "+countdown(c.expires_at))]));
  const hz=el("div",{class:"row mt10"}); (c.hazards||[]).forEach(h=>hz.append(hazChip(h)));
  if(!(c.hazards||[]).length) hz.append(el("span",{class:"muted",style:"font-size:12px"},"No environmental hazards"));
  card.append(hz);
  // compact top kit hints
  const sc=tagScores(c.hazards||[]);
  if(sc.length){ const fav=sc.filter(s=>s.weight>0).slice(0,2), av=sc.filter(s=>s.weight<0).slice(-2);
    const line=el("div",{class:"row mt10",style:"font-size:12px;gap:6px"});
    fav.forEach(s=>line.append(el("span",{class:"chip",style:"border-color:color-mix(in srgb,var(--favored) 45%,var(--line));color:var(--favored)"},"▲ "+tagLabel(s.tag))));
    av.forEach(s=>line.append(el("span",{class:"chip",style:"border-color:color-mix(in srgb,var(--avoid) 45%,var(--line));color:var(--avoid)"},"▼ "+tagLabel(s.tag))));
    card.append(line);
  }
  return card;
}

function tiles(items){ const g=el("div",{class:"tiles"});
  items.forEach(([l,n,sub])=>g.append(el("div",{class:"tile"},
    [el("div",{class:"n"},String(n)),el("div",{class:"l"},l),el("div",{class:"sub"},sub||"")])));
  return g; }

// ===== PLANETS =====
function renderPlanets(){
  const root=$("#planets"); root.innerHTML="";
  const R=state.data.rules;
  const biomes=[...new Set(state.data.named.map(p=>p.biome).filter(Boolean))].sort();
  const sectors=[...new Set(state.data.named.map(p=>p.sector).filter(Boolean))].sort();
  const hazards=Object.keys(R.hazards).sort((a,b)=>R.hazards[a].display_name.localeCompare(R.hazards[b].display_name));

  const q=el("input",{type:"search",placeholder:"Search planet…",value:state.filters.q,
    oninput:e=>{state.filters.q=e.target.value;fillList();}});
  const selBiome=selectFrom("Any biome",biomes.map(b=>[b,R.biomes[b]?.display_name||b]),state.filters.biome,v=>{state.filters.biome=v;fillList();});
  const selHaz=selectFrom("Any hazard",hazards.map(h=>[h,R.hazards[h].display_name]),state.filters.hazard,v=>{state.filters.hazard=v;fillList();});
  const selSec=selectFrom("Any sector",sectors.map(s=>[s,s]),state.filters.sector,v=>{state.filters.sector=v;fillList();});
  root.append(el("div",{class:"controls"},[q,selBiome,selHaz,selSec]));

  const list=el("div",{class:"plist",id:"plist"});
  const detail=el("div",{class:"detail card",id:"pdetail"});
  root.append(el("div",{class:"browser"},[list,detail]));
  fillList(); renderDetail(state.sel);
}
function selectFrom(ph,opts,val,on){ const s=el("select",{onchange:e=>on(e.target.value)});
  s.append(el("option",{value:""},ph)); opts.forEach(([v,l])=>{const o=el("option",{value:v},l); if(v===val)o.selected=true; s.append(o);}); return s; }

function filtered(){ const f=state.filters, q=f.q.trim().toLowerCase();
  return state.data.named.filter(p=>
    (!q || (p.name||"").toLowerCase().includes(q) || (p.sector||"").toLowerCase().includes(q)) &&
    (!f.biome || p.biome===f.biome) && (!f.sector || p.sector===f.sector) &&
    (!f.hazard || (p.hazards||[]).includes(f.hazard)) )
    .sort((a,b)=>a.name.localeCompare(b.name)); }

function fillList(){ const list=$("#plist"); if(!list)return; list.innerHTML="";
  const rows=filtered();
  list.append(el("div",{class:"pitem",style:"cursor:default;background:var(--surface-2)"},
    [el("span",{class:"sc"},`${rows.length} planet${rows.length!==1?"s":""}`),el("span",{})]));
  rows.slice(0,400).forEach(p=>{
    const it=el("div",{class:"pitem",onclick:()=>openPlanet(p.id,false)});
    if(state.sel===p.id)it.setAttribute("aria-selected","true");
    it.append(el("div",{},[el("div",{class:"nm"},p.name),el("div",{class:"sc"},p.sector||"—")]));
    it.append(el("div",{class:"hz"},(p.hazards||[]).map(h=>HAZ_ICON[h]||"•").join(" ")||"—"));
    list.append(it); });
}
function renderDetail(id){ const d=$("#pdetail"); if(!d)return; d.innerHTML="";
  if(id==null){ d.append(el("div",{class:"empty"},"Select a planet to see its hazards and recommended kit.")); return; }
  const p=state.data.byId[id], R=state.data.rules; if(!p)return;
  d.append(el("div",{class:"row between"},[
    el("div",{},[el("h2",{},p.name||("Planet "+id)),
      el("div",{class:"muted",style:"font-size:13px"},`${p.sector||"—"} · ${R.biomes[p.biome]?.display_name||p.biome||"unknown biome"}`)]),
    el("div",{},[el("span",{class:"chip mono"},"#"+id)]) ]));

  const camp=(state.data.live.campaigns||[]).find(c=>c.id===id);
  if(camp) d.append(el("div",{class:"row mt10"},[ facChip(camp.owner),
    camp.is_defense?el("span",{class:"pill def"},"Under defense"):el("span",{class:"pill lib"},"Active liberation"),
    camp.is_mo_target?el("span",{class:"pill mo"},"MO target"):null ]));

  // hazards
  d.append(el("div",{class:"section-title mt12"},"Environmentals"));
  if(!(p.hazards||[]).length){ d.append(el("div",{class:"muted"},"None — a pure faction-and-archetype planet, no environmental modifier.")); }
  (p.hazards||[]).forEach(h=>{ const H=R.hazards[h]||{display_name:h};
    d.append(el("div",{class:"hazblock"},[
      el("div",{class:"row"},[el("b",{},`${HAZ_ICON[h]||"•"} ${H.display_name}`), sevDots(H.severity||1),
        H.is_diurnal?el("span",{class:"chip"},"day/night"):null]),
      el("p",{class:"hazdesc"},H.description||"") ])); });
  if(p.hazard_source==="override") d.append(el("div",{class:"note"},"⚑ These hazards override the biome default — this planet contradicts its biome."));

  // kit
  const sc=tagScores(p.hazards||[]);
  d.append(el("div",{class:"section-title mt12"},"Kit signal from environmentals"));
  if(!sc.length){ d.append(el("div",{class:"muted"},"No environmental modifiers — pick your loadout for the faction and mission.")); }
  else { d.append(kitBars(sc));
    d.append(el("div",{class:"legend"},[
      el("span",{},[el("i",{class:"sw",style:"background:var(--favored)"}),"favored"]),
      el("span",{},[el("i",{class:"sw",style:"background:var(--avoid)"}),"discouraged"]),
      el("span",{class:"muted"},"hover a row for the hazard breakdown") ])); }
}
function openPlanet(id,jump=true){ state.sel=id; if(jump)setTab("planets"); renderPlanets(); fillList(); renderDetail(id);
  const list=$("#plist"); if(list){ const sel=list.querySelector('[aria-selected="true"]'); if(sel)sel.scrollIntoView({block:"nearest"}); } }

// ===== ADVISOR =====
function renderAdvisor(){
  const root=$("#advisor"); root.innerHTML="";
  const R=state.data.rules;
  const planetOpts=state.data.named.map(p=>[String(p.id),`${p.name} · ${p.sector||""}`]);
  const selP=selectFrom("Choose a planet…",planetOpts,state.adv.planet!=null?String(state.adv.planet):"",v=>{state.adv.planet=v?+v:null;drawAdv();});
  const facOpts=Object.keys(FACTION).filter(f=>f!=="super_earth").map(f=>[f,FACTION[f].icon+" "+FACTION[f].name]);
  const selF=selectFrom("Any faction",facOpts,state.adv.faction,v=>{state.adv.faction=v;drawAdv();});
  const missionOpts=(R.missions||[]).map(m=>[m.id,m.display_name]);
  const selM=selectFrom("Any mission",missionOpts,state.adv.mission,v=>{state.adv.mission=v;drawAdv();});
  root.append(el("div",{class:"advbar"},[selP,selF,selM]));
  root.append(el("div",{id:"advout"}));
  drawAdv();
}
function drawAdv(){
  const out=$("#advout"); if(!out)return; out.innerHTML="";
  const R=state.data.rules;
  if(state.adv.planet==null){ out.append(el("div",{class:"card empty"},"Pick a planet to generate a kit recommendation. The scoring is driven by the planet's environmentals; faction and mission add context.")); return; }
  const p=state.data.byId[state.adv.planet]; if(!p)return;
  const sc=tagScores(p.hazards||[]);
  const fav=sc.filter(s=>s.weight>0), av=sc.filter(s=>s.weight<0).slice().reverse();
  const maxAbs=Math.max(0.1,...sc.map(s=>Math.abs(s.weight)));

  // header summary
  const head=el("div",{class:"card"},[
    el("div",{class:"row between"},[
      el("div",{},[el("h2",{},p.name), el("div",{class:"muted",style:"font-size:13px"},`${p.sector||"—"} · ${R.biomes[p.biome]?.display_name||p.biome||""}`)]),
      state.adv.faction?facChip(state.adv.faction):null ]),
    el("div",{class:"row mt10"},(p.hazards||[]).length?(p.hazards||[]).map(hazChip):[el("span",{class:"muted"},"No environmentals")]) ]);
  // ion storm special
  if((p.hazards||[]).includes("ion_storms")) head.append(el("div",{class:"callout"},
    [el("b",{},"⚡ Ion Storms — "),"stratagems cut out intermittently. Lean on a support weapon and a strong primary; deprioritise orbitals, Eagles and sentries you can't recall mid-storm."]));
  // diurnal
  if((p.hazards||[]).some(h=>R.hazards[h]?.is_diurnal)) head.append(el("div",{class:"callout"},
    [el("b",{},"☀/🌙 Day-night swing — "),"this world flips between heat and cold. Energy weapons swing from punished to favoured with the clock; pack for both."]));
  // mission context
  const mission=(R.missions||[]).find(m=>m.id===state.adv.mission);
  if(mission){ const chips=el("div",{class:"row mt10"},(mission.tags||[]).map(t=>el("span",{class:"chip"},t.replace(/_/g," "))));
    head.append(el("div",{class:"section-title mt12"},"Mission focus — "+mission.display_name));
    head.append(chips);
    if(mission.verified===false) head.append(el("div",{class:"muted",style:"font-size:12px;margin-top:6px"},"⚠ mission catalog is an unverified scaffold — treat archetype tags as a hint, not gospel.")); }

  const favCard=el("div",{class:"card"},[el("div",{class:"section-title"},"▲ Favoured this drop")]);
  favCard.append(fav.length?kitBars(fav,maxAbs):el("div",{class:"muted"},"Nothing strongly favoured — free pick."));
  const avCard=el("div",{class:"card"},[el("div",{class:"section-title"},"▼ Discouraged this drop")]);
  avCard.append(av.length?kitBars(av,maxAbs):el("div",{class:"muted"},"Nothing strongly punished."));

  out.append(head);
  out.append(el("div",{class:"advout"},[favCard,avCard]));
  out.append(el("div",{class:"legend",style:"margin-top:10px"},[
    el("span",{class:"muted"},"Weights are additive tag modifiers summed across this planet's environmentals (from hazards.yaml). Hover any bar for the per-hazard breakdown.")]));
}

// ---------- utils ----------
function fmt(n){ if(n==null||isNaN(n))return"—"; return n>=1000?(n/1000).toFixed(n>=10000?0:1)+"k":String(n); }
function dur(sec){ if(sec==null)return""; const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);
  if(d>0)return`${d}d ${h}h`; if(h>0)return`${h}h ${m}m`; return`${m}m`; }
function countdown(iso){ const s=(new Date(iso).getTime()-Date.now())/1000; if(isNaN(s))return""; if(s<=0)return"expired"; return dur(s)+" left"; }
function renderFooter(){ const m=state.data.meta||{};
  $("#footer").innerHTML="";
  $("#footer").append(
    el("div",{},[ "Data: static seed (planets, biomes, hazards) resolved from the git seed + live war state from ",
      el("a",{href:"https://helldiverstrainingmanual.com/",target:"_blank",rel:"noopener"},"Helldivers Training Manual"),
      ". Refreshed by the sourcing workflow." ]),
    el("div",{class:"muted",style:"margin-top:4px"},
      `Sourced ${relTime((state.data.live||{}).generated_at||m.generated_at)} · canary ${((m.canary||{}).drift_count||0)===0?"clean":"drift detected"} · hazards are static, refreshed on patch.`)
  );
}

boot();
// keep countdowns / freshness live
setInterval(()=>{ if(state.data){ renderFreshness(); if(state.tab==="front")renderFront(); } },60000);
</script>
